name: עדכון רשימת הסרטונים

on:
  schedule:
    - cron: "0 3 * * *"   # כל יום ב-05:00/06:00 שעון ישראל
  workflow_dispatch:       # כפתור "Run workflow" להרצה ידנית
  push:
    paths: ["scripts/fetch_videos.py", ".github/workflows/update-videos.yml", "data/selection.json"]

concurrency:
  group: update-videos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - name: Fetch videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/fetch_videos.py
      - name: Commit if changed
        run: |
          git config user.name "video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || (git commit -m "עדכון רשימת הסרטונים" && git pull --rebase origin main && git push)
