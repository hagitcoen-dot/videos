<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../../a11y.js?v=1"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>קולנוע המחשבות</title>
<link rel="stylesheet" href="gfonts/fonts.css">
<link rel="stylesheet" href="fun.css">
<style>
video::-webkit-media-controls,video::-webkit-media-controls-start-playback-button,video::-webkit-media-controls-overlay-play-button,video::-webkit-media-controls-panel{display:none!important;-webkit-appearance:none;opacity:0!important}
video{pointer-events:none;visibility:hidden}
video.on{visibility:visible}

/* קולנוע לילי: אולם קטיפה כהה, מסך מואר באמצע, אלומת מקרן. מראה כהה אחד בכוונה. */
:root{
  --velvet:#1b0a17; --velvet2:#2b0f22; --curtain:#b3173f; --curtain-d:#6e0c27;
  --gold:#f6c453; --screen:#fbf7ec; --ink:#2a1a2e; --cream:#fff6e4; --muted:#d9c3cf;
  --logic:#4fa3ff; --weird:#b07cff; --scary:#ff7d5c; --wish:#ffcf3d; --real:#3fcf8e;
  --display:"Secular One","Rubik",system-ui,sans-serif; --body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#4a1534 0%,var(--velvet) 55%) fixed,var(--velvet);color:var(--cream);
  font-family:var(--body);direction:rtl;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(27,10,23,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(246,196,83,.25)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--velvet)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--gold);font-family:var(--display);font-size:20px;cursor:pointer;padding:4px}
.hud{display:flex;gap:6px;align-items:center}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(246,196,83,.35);border-radius:999px;padding:5px 11px;font-weight:700;font-size:15px;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(246,196,83,.35);background:rgba(255,255,255,.08);font-size:19px;cursor:pointer;color:var(--cream)}
main{max-width:760px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
p{line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:14px 22px;font-size:18px;font-weight:800;cursor:pointer;
  color:var(--ink);background:linear-gradient(180deg,#ffd978,var(--gold));box-shadow:0 5px 0 #b8861f,0 10px 24px rgba(0,0,0,.35);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8861f}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--cream);box-shadow:0 4px 0 rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2)}
.btn.big{font-size:21px;padding:16px 30px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.center{text-align:center}
.fade-in{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- אולם ומסך ---------- */
.hall{position:relative;border-radius:24px;padding:14px 14px 0;background:linear-gradient(180deg,rgba(27,10,23,.25),rgba(27,10,23,.55)),url(img/hall.webp) center 40%/cover,#1f0919;padding:22px 22px 0;box-shadow:inset 0 0 0 2px rgba(246,196,83,.25),0 20px 50px rgba(0,0,0,.5);overflow:hidden}
.screen-wrap{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:#111;
  box-shadow:0 0 0 6px #120610,0 0 40px rgba(255,240,200,.18)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,#ffffff 0%,var(--screen) 55%,#e8ddc6 100%);color:var(--ink);transition:filter .4s}
.screen.off{background:#16101a;color:#6b5a6c}
.screen .art{font-size:clamp(46px,13vw,92px);line-height:1.1;animation:artIn .7s cubic-bezier(.2,1.5,.4,1) both}
.screen .art.fly{animation:artIn .7s cubic-bezier(.2,1.5,.4,1) both,fly 3.2s ease-in-out .7s infinite}
@keyframes artIn{0%{opacity:0;transform:scale(.3) rotate(-10deg)}100%{opacity:1;transform:none}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-30px,-8px) rotate(-6deg)}75%{transform:translate(30px,6px) rotate(6deg)}}
.screen .say{font-weight:800;font-size:clamp(20px,5.4vw,30px);line-height:1.35;max-width:92%;animation:fadeIn .5s .25s both}
.screen .tag{font-size:14px;font-weight:800;padding:4px 12px;border-radius:999px;color:#1b0a17;animation:fadeIn .4s .5s both}
.screen.flicker{animation:flicker .55s steps(6)}
@keyframes flicker{0%{filter:brightness(2.2)}20%{filter:brightness(.5)}40%{filter:brightness(1.6)}60%{filter:brightness(.8)}100%{filter:none}}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;animation:fadeIn .5s both}
.screen .cap{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:max-content;max-width:94%;text-align:center;z-index:1;background:rgba(10,4,10,.68);color:#fff;font-weight:800;font-size:clamp(15px,4vw,22px);line-height:1.35;padding:6px 14px;border-radius:12px;animation:capIn .5s .3s both}
@keyframes capIn{from{opacity:0}to{opacity:1}}
.screen .cap .tag{display:inline-block;margin-inline-start:6px;font-size:13px;vertical-align:middle}
.screen .grain{position:absolute;inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:3;background:repeating-linear-gradient(90deg,var(--curtain) 0 18px,var(--curtain-d) 18px 22px,var(--curtain) 22px 40px);
  box-shadow:inset 0 -20px 30px rgba(0,0,0,.4);transition:transform 1.4s cubic-bezier(.7,0,.3,1)}
.curtain.l{left:0;transform-origin:left}.curtain.r{right:0}
.hall.open .curtain.l{transform:translateX(-96%)}.hall.open .curtain.r{transform:translateX(96%)}
.seats{height:40px;margin-top:0;background:none;opacity:.9}
.beam{position:absolute;left:50%;bottom:-6px;width:70%;height:120%;transform:translateX(-50%);pointer-events:none;z-index:2;
  background:conic-gradient(from 160deg at 50% 100%,transparent 0deg,rgba(255,246,210,.18) 18deg,rgba(255,246,210,.22) 22deg,rgba(255,246,210,.18) 26deg,transparent 40deg);opacity:0;transition:opacity .3s}
.hall.on .beam{opacity:1}

/* ---------- מדריך ---------- */
.guide{display:flex;gap:12px;align-items:flex-end;margin:14px 0}
.guide .g{width:74px;height:74px;flex:none;animation:funFloatY 3s ease-in-out infinite}
.bubble{position:relative;background:var(--cream);color:var(--ink);border-radius:18px;padding:12px 16px;font-size:17.5px;line-height:1.55;min-width:0;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.bubble::after{content:"";position:absolute;right:-8px;bottom:14px;border:8px solid transparent;border-left-color:var(--cream);border-right:0}
.bubble b{color:#9b1238}

/* ---------- כפתורי סוגי מחשבה ---------- */
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tbtn{position:relative;display:flex;align-items:center;gap:10px;text-align:right;border:0;border-radius:18px;padding:12px 12px;cursor:pointer;color:#1b0a17;min-width:0;
  background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .12s}
.tbtn:active{transform:translateY(3px)}
.tbtn .ic{font-size:42px;flex:none}
.tbtn b{display:block;font-size:23px}
.tbtn small{display:block;font-size:17px;opacity:.9;line-height:1.35}
.tbtn{padding:14px 14px}
.tbtn .cnt{position:absolute;top:-8px;left:-6px;background:#1b0a17;color:var(--gold);border:2px solid var(--gold);border-radius:999px;font-size:12px;font-weight:800;padding:1px 7px}
.tbtn.pick{outline:4px solid #fff}
.tbtn.no{filter:grayscale(.3) brightness(.85)}
.real{margin-top:12px;background:rgba(63,207,142,.12);border:1px solid rgba(63,207,142,.5);border-radius:16px;padding:10px 14px;font-size:16.5px;line-height:1.55}
.real b{color:var(--real)}
.prog{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-weight:700}
.bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a5c);border-radius:99px;transition:width .4s}

/* ---------- סרט או מציאות ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.zone{border:0;border-radius:20px;padding:14px 8px;cursor:pointer;color:var(--cream);font-weight:800;font-size:18px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s}
.zone:active{transform:scale(.97)}
.zone .ic{font-size:40px}
.zone small{font-weight:500;font-size:13px;opacity:.85}
.zone.head{background:linear-gradient(160deg,#5b2a83,#2c1145);box-shadow:0 5px 0 #1a0a2a}
.zone.world{background:linear-gradient(160deg,#1f8a62,#0f4d37);box-shadow:0 5px 0 #08301f}
.card{background:var(--cream);color:var(--ink);border-radius:22px;padding:16px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(-30px) rotate(-3deg) scale(.9)}to{opacity:1;transform:none}}
.card .moment{display:block;width:100%;max-width:100%;border-radius:14px;margin:4px 0 2px;aspect-ratio:16/9;object-fit:cover;background:#eee}
.card .art{font-size:54px;line-height:1.1}
.card .txt{font-size:clamp(19px,5vw,24px);font-weight:800;line-height:1.4;margin-top:6px}
.card .ctx{font-size:14px;color:#7a5a6e;margin-bottom:4px}
.fb{margin-top:12px;border-radius:16px;padding:12px 14px;font-size:16.5px;line-height:1.55;animation:fadeIn .35s both}
.fb.ok{background:rgba(63,207,142,.15);border:1px solid rgba(63,207,142,.55)}
.fb.no{background:rgba(255,125,92,.13);border:1px solid rgba(255,125,92,.5)}

/* ---------- הסרט שלי ---------- */
.ideas{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.idea{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:var(--cream);border-radius:14px;padding:11px 14px;text-align:right;font-size:16.5px;cursor:pointer}
.idea:hover{background:rgba(255,255,255,.13)}
.own{display:flex;gap:8px;margin-top:4px}
.own input{flex:1;min-width:0;border-radius:14px;border:2px solid rgba(246,196,83,.5);background:rgba(0,0,0,.25);color:var(--cream);padding:11px 12px;font-size:16.5px;font-family:inherit}
.glasses-say{margin-top:14px;text-align:center}
.glasses-say .quote{display:inline-block;font-family:var(--display);font-size:clamp(20px,5.4vw,27px);color:var(--gold);background:rgba(246,196,83,.1);border:2px dashed rgba(246,196,83,.6);border-radius:18px;padding:12px 18px;line-height:1.4}
.end-cap{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-family:var(--display);font-size:clamp(40px,12vw,70px);color:var(--gold);text-shadow:0 4px 18px rgba(0,0,0,.8);animation:capIn .8s 2.4s both}
.end-title{font-family:var(--display);font-size:clamp(40px,12vw,70px);color:#6b5a6c;letter-spacing:.06em}

/* ---------- משקפיים ---------- */
.glasses-pick{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px}
.gl{border:3px solid transparent;background:rgba(255,255,255,.08);border-radius:18px;padding:10px;cursor:pointer}
.gl.sel{border-color:var(--gold);background:rgba(246,196,83,.15)}
.gl svg{width:110px;height:48px;display:block}
.wearing{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .5s}
.wearing.show{opacity:1}

/* ---------- רחוב ---------- */
.street{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#8fd3ff 0%,#c9ecff 60%,#7a7f8c 60%,#5d616c 100%)}
.street .bld{position:absolute;bottom:40%;font-size:clamp(34px,10vw,64px)}
.street .walker{position:absolute;bottom:14%;right:-15%;font-size:clamp(36px,10vw,60px);animation:walk 3.2s linear forwards}
@keyframes walk{to{right:60%}}
.street video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.street .q{z-index:1;text-shadow:0 4px 12px rgba(0,0,0,.5);position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:clamp(40px,12vw,72px);opacity:0;animation:capIn .5s 1.5s both}

/* ---------- ראש ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 2px rgba(246,196,83,.3)}
.hero img{display:block;width:100%;height:auto}
.hero-screen{position:absolute;left:8.1%;top:9.2%;width:63.6%;height:69%;display:flex;align-items:center;justify-content:center;text-align:center;padding:4%}
.hero-screen h1{font-size:clamp(26px,7.4vw,58px);color:#6e0c27;line-height:1.1;animation:capIn 1s .3s both;text-shadow:0 2px 0 rgba(255,255,255,.5)}
.hero.on .hero-screen{animation:flicker .6s steps(6)}
.hero.on .hero-screen h1{animation:fadeOut .8s .3s both}
@keyframes fadeOut{to{opacity:0;transform:scale(1.15)}}
.chal{margin-top:12px;background:rgba(246,196,83,.15);border:2px dashed var(--gold);border-radius:14px;padding:8px 12px;text-align:center;font-weight:800;color:var(--gold)}
.idea.cam{font-weight:700;font-size:17px}
.idea.cam.yes{background:rgba(63,207,142,.25);border-color:var(--real)}
.idea.cam.head{background:rgba(176,124,255,.2);border-color:var(--weird);opacity:.85}
.guide .g{border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:#3a1029}
.fun-map-guide{border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.headpic{display:block;width:min(320px,80%);margin:6px auto 0}

/* ---------- מפה ---------- */
.fun-map{background:linear-gradient(180deg,#2b0f22,#1b0a17);color:var(--cream);box-shadow:inset 0 0 0 2px rgba(246,196,83,.3),0 20px 50px rgba(0,0,0,.5)}
.fun-map-head p{color:var(--muted)}
.fun-map-head h2{font-family:var(--display);font-weight:400;color:var(--gold)}
.fun-map-board{background:radial-gradient(circle at 50% -20%,rgba(255,246,210,.25),transparent 45%),
  radial-gradient(circle at 20px 22px,#5c1430 0 12px,transparent 13px) 0 0/44px 44px,linear-gradient(180deg,#3a1029,#250b1c)}
.fun-map-path path{stroke:var(--gold);opacity:.7}
.fun-node-name{background:rgba(255,246,228,.95);color:#2a1a2e}
.fun-node-name small{color:#7a5a6e}
.fun-map-total{color:var(--gold)}

/* ---------- תעודה ---------- */
.cert{background:var(--cream);color:var(--ink);border-radius:22px;padding:22px 18px;text-align:center;border:6px double #d9a83c;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:funBounce .8s}
.cert .ribbon{display:inline-block;background:linear-gradient(135deg,var(--curtain),#ff6a8f);color:#fff;font-weight:800;padding:6px 18px;border-radius:999px;font-size:16px}
.cert h2{font-size:clamp(26px,7vw,36px);margin:10px 0 4px;color:#9b1238}
.cert input{font-family:inherit;font-size:20px;font-weight:700;text-align:center;border:0;border-bottom:3px dashed #d9a83c;background:transparent;color:var(--ink);padding:6px;width:min(280px,90%)}
.cert .skill{margin:12px auto 0;max-width:460px;font-size:17.5px;line-height:1.6;background:#fff;border-radius:14px;padding:12px}
.cert .credit{font-size:13px;color:#7a5a6e;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:420px){.tbtn .ic{font-size:30px}.tbtn b{font-size:18px}.tbtn small{font-size:14px}.bubble{font-size:16px}}
/* ---------- לובי עם כרזות ---------- */
.lobby{background:radial-gradient(ellipse at 50% 0%,rgba(255,200,110,.22),transparent 60%),repeating-linear-gradient(90deg,#5a0f2a 0 22px,#4b0b23 22px 44px);
  border-radius:22px;padding:16px 14px 18px;box-shadow:inset 0 0 60px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.4);border:2px solid #7a4a1c}
.lobby-head{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.lobby-head img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex:none}
.lobby-head h2{margin:0;font-family:var(--display);color:var(--gold);font-size:clamp(21px,5.4vw,28px)}
.lobby-head p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.posters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-top:10px}
@media (max-width:720px){.posters{grid-template-columns:repeat(2,1fr);gap:12px}}
.poster{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:center;padding:8px 8px 10px;border-radius:12px;cursor:pointer;color:var(--cream);font:inherit;
  background:linear-gradient(#2b0f22,#1b0a17);border:3px solid #c9973a;box-shadow:0 0 0 3px #3a1a0c,0 8px 18px rgba(0,0,0,.5);transition:transform .2s,filter .3s}
.poster:hover:not(.locked){transform:translateY(-3px) rotate(-.5deg)}
.pnum{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:5px}
.pimg{display:block;aspect-ratio:3/4;border-radius:6px;background:#000 center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.ptitle{font-family:var(--display);font-size:clamp(17px,4.4vw,21px);margin-top:7px;line-height:1.15;color:#fff}
.psub{font-size:13px;color:var(--muted);line-height:1.3;margin-top:3px;min-height:2.6em}
.pstars{margin-top:4px;font-size:20px;letter-spacing:2px;color:rgba(255,255,255,.22)}
.pstars i{font-style:normal}.pstars i.on{color:var(--gold);text-shadow:0 0 8px rgba(246,196,83,.7)}
.poster.locked{filter:grayscale(.85) brightness(.55);cursor:not-allowed}
.plock{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:44px;filter:drop-shadow(0 4px 8px #000)}
.poster.current{animation:pglow 1.8s ease-in-out infinite}
.poster.current::before{content:"";position:absolute;top:-30px;left:50%;width:130%;height:70px;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,225,150,.7),transparent 70%)}
@keyframes pglow{0%,100%{box-shadow:0 0 0 3px #3a1a0c,0 0 22px 6px rgba(255,205,110,.55)}50%{box-shadow:0 0 0 3px #3a1a0c,0 0 36px 14px rgba(255,205,110,.85)}}
.poster.unlocking{animation:punlock .9s ease both}
@keyframes punlock{0%{filter:grayscale(1) brightness(.5);transform:scale(.92)}60%{transform:scale(1.06)}100%{filter:none;transform:none}}
.lobby-exit{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:26px}
.certframe{position:relative;display:flex;gap:12px;align-items:center;text-align:right;padding:12px 18px 12px 22px;border-radius:10px;cursor:pointer;color:var(--cream);font:inherit;
  background:linear-gradient(#3a2412,#24150a);border:4px double #c9973a;filter:brightness(.6);min-width:min(320px,100%)}
.certframe b{display:block;font-family:var(--display);font-size:20px}.certframe small{font-size:13px;color:var(--muted)}
.cf-ic{font-size:34px}
.certframe .lamp{position:absolute;top:-14px;left:50%;width:36px;height:10px;transform:translateX(-50%);border-radius:0 0 18px 18px;background:#6b5a3a}
.certframe.lit{filter:none;box-shadow:0 -14px 40px 6px rgba(255,214,120,.5)}
.certframe.lit .lamp{background:#ffe08a;box-shadow:0 6px 26px 10px rgba(255,214,120,.8)}
.lobby-total{font-weight:700;font-size:18px;background:rgba(0,0,0,.35);padding:8px 14px;border-radius:999px}

(function(){

  /* רעש מסונן: טיק מקרן, פופקורן, גלילת סרט */
  function nz(t,dur,freq,q,vol,sweepTo,type){var a=ac();if(!a)return;var t0=a.currentTime+t,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();

  /* כלי נשיפה רך לפתיחת סרט */
  function brass(f,t,dur,vol){var a=ac();if(!a)return;var t0=a.currentTime+t,o=a.createOscillator(),lp=a.createBiquadFilter(),g=a.createGain();o.type="sawtooth";o.frequency.value=f;lp.type="lowpass";lp.frequency.setValueAtTime(400,t0);lp.frequency.linearRampToValueAtTime(2200,t0+0.12);

  function ok(){done=true;v.classList.add("on");var a=v.parentNode&&v.parentNode.querySelector(".art.tmp");if(a)a.remove();}
  v.addEventListener("playing",ok);
  v.volume=0.3;v.muted=FUN.isMuted();var pr=v.play();if(pr&&pr.catch)pr.catch(function(){v.muted=true;var p2=v.play();if(p2&&p2.catch)p2.catch(function(){document.addEventListener("pointerdown",function(){if(v.isConnected)v.play().catch(function(){});},{once:true});});});

  v.addEventListener("error",function(){if(!v.dataset.retry){v.dataset.retry=1;v.load();v.play();}else fallback();});
  setTimeout(function(){if(done||!v.isConnected)return;if(v.readyState<2)fallback();else if(!v.parentNode.querySelector(".art.tmp")){var a=document.createElement("div");a.className="art tmp";a.textContent=v.dataset.art||"🎬";v.after(a);}},4000);}

  var base=ORDER.map(function(k){var x=shuffle(POOL[k])[0];return {t:x[0],a:x[1],k:k};});
  var extraK=ORDER[Math.random()*4|0],ex=shuffle(POOL[extraK].filter(function(x){return x[0]!==base[ORDER.indexOf(extraK)].t;}))[0];
  var items=shuffle(base.concat([{t:ex[0],a:ex[1],k:extraK}])).concat([Object.assign({ch:1},shuffle(CHALLENGE)[0])]),
      i=0,right=0,tried=false;
  setCombo(0);
  function render(){
    var it=items[i];tried=false;
    go('<div class="fade-in">'+hall('<div class="art'+(it.k==="weird"?" fly":"")+'">'+it.a+'</div><div class="say">"'+it.t+'"</div>',true)+
      '<div class="prog"><span>🎞️ '+(i+1)+'/'+items.length+'</span><div class="bar"><i style="width:'+(i/items.length*100)+'%"></i></div></div>'+
      (it.ch?'<div class="chal">⭐ שאלת אתגר! לפעמים אותה מחשבה שייכת ליותר מסוג אחד.</div>':'')+
      '<h3 class="center" style="margin-top:14px;font-size:22px">'+(it.ch?'לאיזה סוג המחשבה הזו יכולה להשתייך?':'איזה סרט מוקרן עכשיו על המסך?')+'</h3>'+
      '<div class="types">'+ORDER.map(function(k){var t=T[k];return '<button class="tbtn" style="--c:'+t.c+'" data-k="'+k+'"><span class="ic">'+t.ic+'</span><span><b>'+t.short+'</b><small>'+t.desc+'</small></span></button>';}).join("")+'</div><div id="fb"></div></div>');
    document.getElementById("hall").classList.add("on");rattle();
    app.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){pick(b);};});
  }
  function pick(b){
    var it=items[i],k=b.dataset.k,ks=[].concat(it.k),fb=document.getElementById("fb");
    if(ks.indexOf(k)>=0){
      if(!tried){right++;setCombo(combo+1);addPop(it.ch?20:10,b);if(combo>=3){FUN.sfx("combo",combo);FUN.bigBanner("🔥 רצף "+combo+"!");}else FUN.sfx("good");}else FUN.sfx("good");
      FUN.confettiAt(b,18);
      app.querySelectorAll("[data-k]").forEach(function(x){x.disabled=true;var on=ks.indexOf(x.dataset.k)>=0;x.classList.toggle("no",!on);x.classList.toggle("pick",on);});
      if(!it.ch)project('<div class="art'+(k==="weird"?" fly":"")+'">'+it.a+'</div><div class="say">"'+it.t+'"</div><div class="tag" style="background:'+T[k].c+'">'+T[k].ic+' '+T[k].name+'</div>');
      fb.innerHTML='<div class="fb ok">'+(it.ch?'🌟 <b>נכון, ויש כאן שתי תשובות!</b> '+it.why+'<br>אותה מחשבה יכולה להיות מכמה סוגים, וזה בסדר.':'✅ <b>נכון! '+T[k].name+'</b>: '+T[k].desc+'.')+'<br>📽️ וזה עדיין רק סרט על המסך בראש.</div><div class="row" style="margin-top:12px"><button class="btn" id="n">'+(i+1<items.length?"לסרט הבא ⬅️":"⭐ סיום")+'</button></div>';
      document.getElementById("n").onclick=function(){i++;if(i<items.length)render();else finish(1,FUN.starsFor(right,items.length),right,items.length);};
      document.getElementById("n").scrollIntoView({behavior:"smooth",block:"center"});
    }else{
      tried=true;setCombo(0);FUN.sfx("soft");FUN.shake(b);b.disabled=true;b.classList.add("no");
      fb.innerHTML='<div class="fb no">🤔 כמעט! הנה רמז: '+hint(ks[0])+' נסו שוב.</div>';
    }
  }
  function hint(k){return {logic:"זה משהו רגיל מהיום יום, בלי 'הלוואי' ובלי משהו מאיים.",weird:"האם זה יכול לקרות בעולם האמיתי? 😄",scary:"האם הסרט הזה מדאיג או מלחיץ? הוא מתחיל הרבה פעמים ב'מה אם...'.",wish:"שימו לב למילים 'הלוואי' או 'הייתי רוצה'."}[k];}
  render();
}

/* ===================== תחנה 3: מבחן המצלמה ===================== */
function st3(){
  var items=shuffle(PAIRS).slice(0,5),i=0,right=0,tried=false;setCombo(0);
  function render(){
    var it=items[i];tried=false;
    var opts=shuffle([{s:it.f,f:1},{s:it.th,f:0}]);
    go('<div class="fade-in">'+(i===0?'<div class="street" id="scr" style="margin-bottom:12px"><video src="video/camera.mp4" data-once="1" playsinline autoplay muted preload="auto" disablepictureinpicture disableremoteplayback></video></div>':'')+(i===0?guide('יש <b>מה שקורה באמת</b>, ויש <b>סרט בראש</b>. נשאל: <b>מה מצלמה הייתה רואה או שומעת ברגע הזה?</b>'):'')+
      '<div class="prog"><span>🎥 '+(i+1)+'/'+items.length+'</span><div class="bar"><i style="width:'+(i/items.length*100)+'%"></i></div></div>'+
      '<div class="card" style="margin-top:12px"><div class="ctx">'+it.ctx+'</div>'+(it.img?'<img class="moment" src="'+it.img+'" alt="">':'<div class="art">'+it.a+'</div>')+
      '<div class="txt" style="font-size:clamp(17px,4.4vw,21px)">'+it.f+'<br><span style="color:#7a5a6e">ו</span>'+it.th.replace(/^חשבתי/,"חשבתי").replace(/^דמיינתי/,"דמיינתי")+'</div></div>'+
      '<h3 class="center" style="margin-top:14px;font-size:20px">🎥 מה המצלמה הייתה רואה או שומעת?</h3>'+
      '<div class="ideas">'+opts.map(function(o){return '<button class="idea cam" data-f="'+o.f+'">'+o.s+'</button>';}).join("")+'</div><div id="fb"></div></div>');
    if(i===0)startVid();
    app.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){pick(b);};});
  }
  function pick(b){
    var it=items[i],fb=document.getElementById("fb");
    if(b.dataset.f==="1"){
      if(!tried){right++;setCombo(combo+1);addPop(10,b);if(combo>=3){FUN.sfx("combo",combo);FUN.bigBanner("🔥 רצף "+combo+"!");}else FUN.sfx("good");}else FUN.sfx("good");
      FUN.confettiAt(b,18);app.querySelectorAll("[data-f]").forEach(function(x){x.disabled=true;x.classList.add(x.dataset.f==="1"?"yes":"head");});
      fb.innerHTML='<div class="fb ok">✅ <b>נכון!</b> 🎥 '+(it.cam||('המצלמה הייתה קולטת: '+it.f))+'.<br>🎬 ומה שהראש הוסיף, "'+it.th.replace(/^(חשבתי|דמיינתי):?\s*(ש)?/,"")+'", זה <b>סרט בראש</b> ('+T[it.k].ic+' '+T[it.k].name+'). מצלמה לא יכולה לצלם מחשבות.</div><div class="row" style="margin-top:12px"><button class="btn" id="n">'+(i+1<items.length?"הבא ⬅️":"⭐ סיום")+'</button></div>';
      document.getElementById("n").onclick=function(){i++;if(i<items.length)render();else finish(2,FUN.starsFor(right,items.length),right,items.length);};
      document.getElementById("n").scrollIntoView({behavior:"smooth",block:"center"});
    }else{
      tried=true;setCombo(0);FUN.sfx("soft");FUN.shake(b);b.disabled=true;
      fb.innerHTML='<div class="fb no">🤔 מצלמה קולטת רק מה שרואים ושומעים. היא לא יכולה לצלם מה שעובר לנו בראש. נסו שוב!</div>';
    }
  }
  render();
}

/* ===================== תחנה 4: הסרט שלי ===================== */
function st4(){
  var made=0,NEED=2;
  function choose(){
    wear(false);
    go('<div class="fade-in">'+hall('<div class="art">🎥</div><div class="say">עכשיו אתם הבמאים!</div>',true)+
      '<div class="prog"><span>🍿 '+made+'/'+NEED+'</span><div class="bar"><i style="width:'+(made/NEED*100)+'%"></i></div></div>'+
      guide('איזה סוג סרט <b>אתם</b> בוחרים להקרין עכשיו?')+
      '<div class="types">'+ORDER.map(function(k){var t=T[k];return '<button class="tbtn" style="--c:'+t.c+'" data-k="'+k+'"><span class="ic">'+t.ic+'</span><span><b>'+t.short+'</b><small>'+t.desc+'</small></span></button>';}).join("")+'</div></div>');
    app.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){FUN.sfx("pop");write(b.dataset.k);};});
  }
  function write(k){
    var t=T[k],ideas=DIRECTOR[k];
    go('<div class="fade-in">'+guide('בחרו מחשבה '+t.ic+' <b>'+t.short+'</b>, או כתבו מחשבה משלכם:')+
      '<div class="ideas">'+ideas.map(function(x,j){return '<button class="idea" data-j="'+j+'">'+x[1]+' '+x[0]+'</button>';}).join("")+
      '<form class="own" id="ownF"><input id="ownT" maxlength="70" placeholder="✏️ המחשבה שלי..." autocomplete="off"><button class="btn" type="submit">הקרנה</button></form></div>'+
      '<div class="row" style="margin-top:12px"><button class="btn ghost" id="back">⬅️ סוג אחר</button></div></div>');
    app.querySelectorAll(".idea").forEach(function(b){b.onclick=function(){var x=ideas[+b.dataset.j];show(k,x[0],x[1],x[2]);};});
    document.getElementById("ownF").onsubmit=function(e){e.preventDefault();var v=document.getElementById("ownT").value.trim();if(!v){FUN.shake(this);return;}show(k,v,t.ic);};
    document.getElementById("back").onclick=choose;
  }
  function show(k,txt,art,vid){
    go('<div class="fade-in">'+hall('',true)+'<div id="step"></div></div>');
    var tx=txt.replace(/[<>]/g,""),tg='<span class="tag" style="background:'+T[k].c+'">'+T[k].ic+' '+T[k].short+'</span>';
    project(vid?vidHTML(vid,'"'+tx+'"'+tg,art):'<div class="art'+(k==="weird"?" fly":"")+'">'+art+'</div><div class="say">"'+tx+'"</div><div class="tag" style="background:'+T[k].c+'">'+T[k].ic+' '+T[k].name+'</div>');
    var step=document.getElementById("step");
    step.innerHTML='<div class="glasses-say fade-in"><p style="font-size:18px">🕶️ מרכיבים משקפי צופה, מסתכלים על המסך, ואומרים בקול או בלב:</p><div class="quote">"יש לי מחשבה שעוברת בראש"</div>'+
      '<div class="row" style="margin-top:14px"><button class="btn" id="said">🎤 אמרתי בקול</button><button class="btn" id="said2">💭 אמרתי בלב</button></div></div>';
    wear(true);
    function said(){
      addPop(15,this);FUN.sfx("good");
      var s=document.getElementById("scr");s.className="screen off";s.innerHTML='<video src="video/off.mp4" data-once="1" playsinline autoplay muted preload="auto" disablepictureinpicture disableremoteplayback></video><div class="end-cap">סוף</div>';startVid();
      document.getElementById("hall").classList.remove("on");FUN.sfx("soft");
      setTimeout(function(){wear(false);made++;
        step.innerHTML=guide('הסרט נגמר והמסך כבה. 🎞️<br><b>ובמציאות?</b> אתם עדיין כאן. המחשבה <b>עברה</b>, והמציאות לא השתנתה.')+
          '<div class="row"><button class="btn" id="n">'+(made<NEED?"🍿 לסרט הבא ("+made+"/"+NEED+")":"⭐ סיום")+'</button></div>';
        document.getElementById("n").onclick=function(){made<NEED?choose():finish(3,3);};
        document.getElementById("n").scrollIntoView({behavior:"smooth",block:"center"});
      },3000);
    }
    document.getElementById("said").onclick=said;document.getElementById("said2").onclick=said;
  }
  choose();
}

/* ===================== תעודה ===================== */
function cert(){
  mapBtn.hidden=false;var tot=ST.stars.reduce(function(a,b){return a+(b||0);},0),name="";
  try{name=localStorage.getItem("fun-name")||"";}catch(e){}
  go('<div class="cert" id="c"><div class="ribbon">🎬 תעודת צופה מקצועי 🎬</div>'+
    '<div style="display:flex;justify-content:center;gap:8px;margin-top:10px"><img src="'+GUIDE+'" alt="" style="width:80px;height:80px">'+(ST.glasses?'<span style="width:120px;align-self:center">'+glassesSVG(GLASSES[ST.glasses])+'</span>':'')+'</div>'+
    '<h2>צופים מקצועיים בקולנוע המחשבות</h2>'+
    '<input id="nm" maxlength="20" placeholder="כתבו כאן את השם" value="'+name.replace(/"/g,"")+'">'+
    '<div class="skill">אני יודע/ת ש<b>מחשבה היא כמו סרט</b> שמוקרן על מסך בתוך הראש.<br>יש סרטים רגילים, מוזרים, מטרידים וסרטי משאלות.<br>וזה שסרט מוקרן בראש, <b>לא הופך אותו למציאות.</b></div>'+
    '<div style="font-size:22px;font-weight:800;margin-top:12px">⭐ '+tot+' / 12 · 🍿 '+ST.pop+'</div>'+
    '<div class="credit">חגית כהן CBT | חברתי</div></div>'+
    guide('מעולה! 🎉 בפעם הבאה שסרט מוקרן לכם בראש, אפשר להרכיב משקפי צופה ולהגיד: <b>"יש לי מחשבה שעוברת בראש"</b>.',"wow")+
    '<div class="row"><button class="btn ghost" id="m">🎟️ חזרה ללובי</button><button class="btn ghost" id="again">🔄 משחקים מההתחלה</button></div>');
  document.getElementById("nm").oninput=function(){try{localStorage.setItem("fun-name",this.value);}catch(e){}};
  document.getElementById("m").onclick=function(){showMap();};
  document.getElementById("again").onclick=function(){ST={stars:[0,0,0,0],unlocked:1,pop:0,glasses:ST.glasses,intro:false};save();paintPop();intro1();};
  FUN.sfx("fanfare");FUN.confettiSides(60);
}

/* ===================== התחלה ===================== */
if(ST.intro)showMap();else intro1();
})();
</script>
