*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Rubik,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(124,196,255,.25),transparent 60%),radial-gradient(ellipse at 100% 110%,rgba(182,156,255,.22),transparent 55%);transition:background-color 2s}

.sky{position:fixed;inset:0;pointer-events:none;z-index:0}

@keyframes tw{50%{opacity:.1}}
.mote{position:fixed;bottom:-20px;width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:.35;filter:blur(1px);pointer-events:none;z-index:0;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) translateX(30px);opacity:0}}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.top b{font-size:17px;font-weight:800;opacity:.9}
.tools{display:flex;gap:6px}
.ib{background:var(--card);border:1px solid var(--line);border-radius:12px;height:38px;min-width:38px;padding:0 10px;font-size:15px}
.ib.on{border-color:var(--gold);color:var(--gold)}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:6px 16px 40px;min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 18px;text-align:center;backdrop-filter:blur(6px);animation:fadeUp .9s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.title{font-size:clamp(46px,14vw,78px);font-weight:800;letter-spacing:2px;line-height:1;margin:6px 0;

.big{font-size:62px;line-height:1.1;margin-bottom:8px}

.btn{border:0;border-radius:18px;padding:14px 26px;font-weight:800;font-size:18px;color:#1a1640;background:var(--gold);box-shadow:0 5px 0 #b8952e;margin-top:14px}

.c.next{animation:glow 2.4s ease-in-out infinite}

.c.on{border-style:solid;background:radial-gradient(circle,#fff,var(--accent));box-shadow:0 0 26px var(--accent);transform:scale(1.06)}
.prog{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px auto 0;max-width:220px}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.prog i.run{width:100%;transition:width linear}
.hint{font-size:14px!important;color:var(--soft)}
.feels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.feel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;font-size:16px;font-weight:600}
.feel span{display:block;font-size:32px}
.feel.sel{border-color:var(--gold)}
.answer{min-height:0;margin-top:10px}

@media print{.top,.sky,.mote,.btn,details{display:none!important}body{background:#fff;color:#000}.card{border:2px solid #333}}

<script>
(function () {
  "use strict";

  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* כוכבים ברקע */

  for (var i = 0; i < 40; i++) { var s = document.createElement("i"); s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%"; s.style.animationDelay = Math.random() * 4 + "s"; sky.appendChild(s); }
  function mote() { if (reduce) return; var m = document.createElement("div"); m.className = "mote"; m.style.left = Math.random() * 100 + "vw"; var d = 9 + Math.random() * 7; m.style.animationDuration = d + "s"; document.body.appendChild(m); setTimeout(function () { m.remove(); }, d * 1000); }
  setInterval(mote, 1400);

  /* צלילים רכים */
  var actx = null, muted = false;
  function ctx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === "suspended") actx.resume(); return actx; }
  function bell(f, vol, dur) {

    var t = c.currentTime;
    [1, 2.01, 3.02].forEach(function (h, k) {
      var o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = f * h;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime((vol || .12) / (k + 1), t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + (dur || 2.5));

  function home() {

      '<button class="btn" id="go">▶ מתחילים</button>' +
      '<details><summary>👩‍🏫 להורים ולמטפלים</summary>' +
      '<p>5-4-3-2-1 הוא תרגיל קרקוע (grounding): הפניית קשב מכוונת אל גירויים חושיים בהווה. כשילד שקוע בדאגה, הקשב נמשך לתרחישים של עתיד ("ומה אם...") או לזיכרונות. ספירה של מה שרואים, מרגישים, שומעים, מריחים וטועמים מחזירה את הקשב לרגע הנוכחי ותופסת "מקום" בזיכרון העבודה.</p>' +
      '<p>חשוב להציג אותו ככלי שעוזר להתארגן, לא כדרך להעלים רגש. כל רגש לגיטימי, וגם אם הדאגה נשארת, זה בסדר. כדאי לתרגל כשרגועים, כדי שיהיה זמין ברגע קשה.</p>' +
      '<p>מומלץ לעשות את התרגיל במקום שקט. אפשר להפעיל הקראה (אם בדפדפן יש קול עברי), או שמבוגר יקריא בקול.</p></details>' +
      '<p class="credit">חגית כהן CBT</p></div>';
    app.querySelector("#go").addEventListener("click", function () { ctx(); bell(523); why(0); });
  }

  /* ---------- הרציונל ---------- */
  var WHY = [
    { e: "🧠💭", t: "כשאנחנו מודאגים, הראש רץ: \"ומה אם...?\", \"מה יקרה מחר?\". המחשבות קופצות לעתיד או למה שכבר קרה." },
    { e: "🖐️👀👂", t: "לחושים יש סוד: הם תמיד נמצאים כאן ועכשיו. העיניים רואות רק את מה שיש עכשיו, והאוזניים שומעות רק את מה שקורה עכשיו." },

  ];
  function why(i) {
    clearAll();
    var w = WHY[i], dots = WHY.map(function (_, k) { return '<i class="' + (k === i ? "on" : "") + '"></i>'; }).join("");
    app.innerHTML = '<div class="card"><h2 style="font-size:24px;margin-bottom:6px">למה זה עוזר?</h2><div class="big">' + w.e + '</div><p>' + w.t + '</p>' +
      '<div class="row"><button class="btn" id="next">' + (i < WHY.length - 1 ? "הבא ←" : "🌙 מתחילים את התרגול") + '</button></div><div class="dots">' + dots + '</div></div>';
    speak(w.t);
    app.querySelector("#next").addEventListener("click", function () { bell(NOTES[i + 1]); i < WHY.length - 1 ? why(i + 1) : ready(); });
  }

  /* ---------- התכוננות ונשימות ---------- */
  function breathe(n, msgTop, done) {
    clearAll(); accent("var(--c5)");
    app.innerHTML = '<div class="card"><p class="soft">' + msgTop + '</p><div class="orb-wrap"><div class="orb" id="orb"></div></div><div class="breath-word" id="bw"></div>' +
      '<p class="hint" id="bc"></p><button class="btn ghost" id="skip" style="font-size:15px;padding:9px 16px">דילוג ←</button></div>';
    var orb = app.querySelector("#orb"), bw = app.querySelector("#bw"), bc = app.querySelector("#bc"), k = 0;
    speak(msgTop);
    function cycle() {
      if (k >= n) { done(); return; }
      bc.textContent = "נשימה " + (k + 1) + " מתוך " + n;
      orb.className = "orb in"; bw.textContent = "שואפים... 🌬️"; bell(392, .07, 3.5);
      later(function () { orb.className = "orb out"; bw.textContent = "ונושפים לאט..."; bell(330, .06, 4.5); }, 4000);
      later(function () { k++; cycle(); }, 10500);

  }
  function ready() {
    breathe(3, "שבו בנוח. רגליים על הרצפה, ידיים על הברכיים. נתחיל בשלוש נשימות איטיות.", function () { sense(0); });
  }

  /* ---------- החושים ---------- */
  var SENSES = [
    { n: 5, e: "👀", c: "var(--c5)", t: "הרימו את העיניים מהמסך והסתכלו סביבכם לאט.", q: "מצאו 5 דברים שאתם רואים", how: "שימו לב לצבע ולצורה. אמרו כל דבר בלב או בקול." },
    { n: 4, e: "✋", c: "var(--c4)", t: "עכשיו שימו לב לגוף.", q: "מצאו 4 דברים שאתם מרגישים במגע", how: "הרגליים על הרצפה, הבגד על העור, הידיים על הברכיים. חלק? רך? חם? קר?" },

    { e: "😌", t: "יותר רגוע לי", a: "איזה יופי. שימו לב איך זה מרגיש בגוף, כדי לזכור את זה." },
    { e: "🙂", t: "קצת יותר טוב", a: "גם \"קצת\" זה הרבה. כל פעם שמתרגלים, זה נעשה קל יותר." },
    { e: "😐", t: "אותו דבר", a: "זה בסדר גמור. לפעמים צריך לתרגל כמה פעמים. אפשר לחזור על התרגיל, או לנסות כלי אחר." },
    { e: "🌀", t: "עדיין יש דאגה", a: "זה בסדר, כל רגש לגיטימי. אפשר לחזור על התרגיל, ואפשר לספר למבוגר שאתם סומכים עליו מה מדאיג אתכם." }
  ];
  function finish() {
    breathe(1, "כל הכבוד! עוד נשימה אחת גדולה לסיום.", feelings);
  }
  function feelings() {
    clearAll(); accent("var(--gold)");
    app.innerHTML = '<div class="card"><div class="big">🌟</div><h2 style="font-size:26px">עשיתם את זה!</h2>' +
      '<p>מה אתם מרגישים עכשיו? כל תשובה נכונה.</p>' +
      '<div class="feels">' + FEELS.map(function (f, k) { return '<button class="feel" type="button" data-k="' + k + '"><span>' + f.e + '</span>' + f.t + '</button>'; }).join("") + '</div>' +
      '<div class="answer" id="ans"></div></div>';
    [0, 2, 4].forEach(function (k, j) { later(function () { bell(NOTES[k], .08, 3); }, j * 350); });
    speak("עשיתם את זה! מה אתם מרגישים עכשיו? כל תשובה נכונה.");
    app.querySelectorAll(".feel").forEach(function (b) {
      b.addEventListener("click", function () {
        app.querySelectorAll(".feel").forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel");
        var f = FEELS[+b.dataset.k]; bell(784, .08); speak(f.a);
        app.querySelector("#ans").innerHTML = '<p>' + f.a + '</p><button class="btn" id="end">הלאה ←</button>';
        app.querySelector("#end").addEventListener("click", takeaway);
      });
    });
  }
  function takeaway() {
    clearAll(); accent("var(--c3)");
    app.innerHTML = '<div class="card"><h2 style="font-size:26px">🖐️ היד של 5-4-3-2-1</h2><p class="soft">היד תמיד איתכם, אז גם התרגיל תמיד איתכם.</p>' +
      '<div class="hand"><span><b>👀</b>5 רואים</span><span><b>✋</b>4 מרגישים</span><span><b>👂</b>3 שומעים</span><span><b>👃</b>2 מריחים</span><span><b>👅</b>1 טועמים</span></div>' +
      '<p><b>מתי אפשר להשתמש בזה?</b></p><p class="soft">לפני מבחן, לפני השינה, כשהראש מלא ב"ומה אם...", או בכל פעם שרוצים לחזור לכאן ועכשיו.</p>' +
      '<p class="soft">💡 טיפ: תרגלו גם כשאתם רגועים. ככה יהיה קל יותר להיזכר בזה ברגע קשה.</p>' +
      '<div class="row"><button class="btn" id="again">🔄 עוד פעם</button><button class="btn ghost" id="pr">🖨️ הדפסה</button></div></div>';
    app.querySelector("#again").addEventListener("click", function () { ready(); });
    app.querySelector("#pr").addEventListener("click", function () { print(); });
  }

  home();
})();
</script>
